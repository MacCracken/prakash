name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # prakash vendors the full stdlib snapshot under lib/ for hermetic, reproducible
  # builds (it shadows the toolchain's version-matched lib/ — intentional).
  CYRIUS_NO_WARN_SHADOW_LIB: "1"

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Piped through the UPSTREAM installer, fetched from the pin's own
        # IMMUTABLE tag, rather than unpacking the release tarball by hand.
        # The hand-rolled block this replaces had three defects; only the first
        # was visible, and it is a hard failure from 6.5.33 onward:
        #
        #   1. LAYOUT. cyrius resolves its stdlib snapshot from
        #      ~/.cyrius/versions/<pin>/lib. The old block laid the tarball out
        #      FLAT as ~/.cyrius/{bin,lib}, so `cyrius deps` fails with
        #      "pins version <pin> but it is not installed at
        #      .../versions/<pin>/lib". Reproduced against 6.5.33.
        #   2. NO INTEGRITY CHECK. It was a bare `curl -sLO` on a release
        #      tarball, untarred. The installer fails closed on a missing,
        #      unverifiable or mismatched .sha256 (CVE-21) and verifies an
        #      Ed25519 signature over SHA256SUMS where one is published
        #      (CVE-13). This repo ships a SECURITY.md and a security job and
        #      was installing an unverified binary toolchain.
        #   3. THE STEP COULD NOT FAIL. Every copy ended in
        #      `2>/dev/null || true`, so an empty bin/ or a missing lib/
        #      "installed successfully" and surfaced later as an unrelated
        #      error. A step that cannot fail is not a step.
        #
        # The pin in cyrius.cyml stays the single source of truth — no version
        # is hardcoded in this YAML.
        run: |
          set -euo pipefail
          CYRIUS_VERSION="$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)"
          [ -n "$CYRIUS_VERSION" ] || { echo "::error::no cyrius pin in cyrius.cyml"; exit 1; }
          echo "Installing Cyrius $CYRIUS_VERSION (pin from cyrius.cyml)"
          curl -sSfL "https://raw.githubusercontent.com/MacCracken/cyrius/$CYRIUS_VERSION/scripts/install.sh" \
            | CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Verify toolchain matches the pin
        # The layout failure above surfaced two steps downstream as a path error
        # from `cyrius deps`. Assert it where it is diagnosable instead.
        run: |
          set -euo pipefail
          PIN="$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)"
          GOT="$(cyrius version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          [ "$GOT" = "$PIN" ] || { echo "::error::cyrius is $GOT but cyrius.cyml pins $PIN"; exit 1; }
          [ -d "$HOME/.cyrius/versions/$PIN/lib" ] || {
            echo "::error::no stdlib snapshot at ~/.cyrius/versions/$PIN/lib"; exit 1; }
          echo "toolchain $GOT matches pin; snapshot has $(ls "$HOME/.cyrius/versions/$PIN/lib" | wc -l) files"

      - name: Resolve dependencies
        # Clones the hisab git dep (tag 2.11.1) and links lib/hisab.cyr; the
        # stdlib subset is committed under lib/, so no `cyrius lib sync` needed.
        run: cyrius deps

      - name: Verify dep hashes
        # cyrius.lock is committed; a mismatch fails the build.
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          else
            echo "::warning::no cyrius.lock committed yet — skipping verify"
          fi

      - name: Lint
        # A file fails on either non-zero rc OR a `^  warn ` line in stdout.
        # `cyrius lint` exits 0 even with warnings as of 6.2.11, so the stdout
        # grep is the load-bearing condition. `set +e` keeps the loop alive
        # past a per-file warning so the report covers every file.
        run: |
          set +e
          fail=0
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr examples/*.cyr; do
            [ -f "$f" ] || continue
            echo "=== cyrlint: $f ==="
            out=$(cyrius lint "$f" 2>&1)
            rc=$?
            echo "$out"
            if [ "$rc" -ne 0 ] || echo "$out" | grep -qE '^\s*warn '; then
              echo "::error file=$f::cyrius lint failed (rc=$rc)"
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: warnings present"; exit 1; }

      - name: Format check
        # `cyrius fmt <file> --check` signals drift via exit code and writes
        # nothing to stdout in check mode — never diff its stdout. Aggregate
        # the rc across files so every drifted file is annotated.
        #
        # ⚠ THE REMEDIATION STRING IS LOAD-BEARING. `cyrius fmt` REWRITES IN
        # PLACE as of cyrius 6.5.28 (it was stdout-only before). The advice
        # this step used to print — `cyrius fmt $f > tmp && mv tmp $f` — now
        # captures ZERO bytes and moves an EMPTY file over the source,
        # truncating it. Measured at 6.5.33: stdout is 0 bytes and the file is
        # rewritten in place. Anything shaped like `cyrius fmt f.cyr > f.new`
        # must not be reintroduced.
        run: |
          fail=0
          for f in src/*.cyr tests/*.tcyr tests/*.bcyr examples/*.cyr; do
            [ -f "$f" ] || continue
            cyrius fmt "$f" --check >/dev/null 2>&1 || {
              echo "::error file=$f::fmt drift — run 'cyrius fmt $f' (rewrites in place)"
              fail=1
            }
          done
          [ $fail -eq 0 ] || { echo "fmt: drift detected"; exit 1; }

      - name: Vet
        run: cyrius vet src/main.cyr

      - name: Verify dist bundles are in sync with lib/
        # prakash ships TWO bundles: `cyrius distlib` -> dist/prakash.cyr
        # (math-only) and `cyrius distlib ai` -> dist/prakash-ai.cyr (+ AI
        # client). Fail CI if either committed bundle drifts from what the
        # current lib/ + src/ would produce — regenerate both and commit.
        run: |
          cyrius distlib
          cyrius distlib ai
          # `cyrius distlib` gets the .deps sidecars backwards for prakash's
          # inverted layout (base = narrow math-only, profile = wide + TLS), so
          # we rewrite them from the manifest. See the script header.
          ./scripts/sync-deps-sidecar.sh
          if ! git diff --quiet dist/; then
            echo "ERROR: a dist artifact is stale. Run 'cyrius distlib && cyrius distlib ai"
            echo "       && ./scripts/sync-deps-sidecar.sh' and commit."
            git --no-pager diff --stat dist/
            exit 1
          fi
          echo "dist/ bundles and .deps sidecars are in sync"

      - name: Verify core bundle is TLS-free
        # The two-bundle split's whole promise: dist/prakash.cyr is math-only, so
        # a consumer that wants optics never compiles TLS. This also validates
        # the AI_ONLY fold list in scripts/sync-deps-sidecar.sh — if a core
        # module ever starts using one of those folds, the sidecar would begin
        # under-reporting, and this fails first.
        run: |
          if grep -nE '\bsandhi_|\btls_[a-z]|\bhttp_[a-z]|\btcp_|\bdynlib_|\brand_[a-z]' dist/prakash.cyr; then
            echo "::error::dist/prakash.cyr references an AI/TLS-only fold — the math-only bundle must not."
            exit 1
          fi
          echo "dist/prakash.cyr is free of sandhi/TLS/net symbols"

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/prakash
          echo "prakash: $(wc -c < build/prakash) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/prakash | grep -q "7f45 4c46"

      - name: Test
        run: |
          for f in tests/*.tcyr; do
            [ -f "$f" ] || continue
            echo "::group::test $f"
            cyrius test "$f"
            echo "::endgroup::"
          done

      - name: Examples
        # The examples include dist/prakash.cyr — the exact surface a consumer
        # gets — so running them is an end-to-end check of the published bundle,
        # not just of src/. A non-zero exit fails the build.
        run: |
          for f in examples/*.cyr; do
            [ -f "$f" ] || continue
            echo "::group::example $f"
            cyrius run "$f"
            echo "::endgroup::"
          done

      - name: Bench
        run: |
          for f in tests/*.bcyr; do
            [ -f "$f" ] || continue
            cyrius bench "$f"
          done

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md LICENSE cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING

      - name: Verify version consistency
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -qF 'version = "${file:VERSION}"' cyrius.cyml \
            || { echo "FAIL: cyrius.cyml version is not \${file:VERSION}"; exit 1; }
          grep -q "$VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        # Comment lines are ignored. Flags raw process/exec syscalls, writes to
        # system paths, and oversized stack buffers across the library surface.
        run: |
          FAIL=0
          scan() {
            local label="$1"; shift
            local pat="$1"; shift
            local hits
            hits=$(grep -rn "$pat" src/ 2>/dev/null | awk -F: '
              { line=$3; for(i=4;i<=NF;i++) line=line":"$i;
                sub(/^[[:space:]]+/,"",line);
                if (substr(line,1,1) != "#") print $1":"$2":"line }')
            if [ -n "$hits" ]; then
              echo "FAIL: $label"; echo "$hits"; FAIL=1
            fi
          }
          scan "raw execve"      'syscall\(\s*59'
          scan "raw fork"        'syscall\(\s*57'
          scan "sys_system"      '\bsys_system\s*\('
          scan "writes to /etc"  '"/etc/'
          scan "writes to /bin"  '"/bin/'
          scan "writes to /sbin" '"/sbin/'
          awk -F: '
            /var [A-Za-z_][A-Za-z0-9_]*\[[0-9]+\]/ {
              match($0, /\[[0-9]+\]/); s=substr($0,RSTART+1,RLENGTH-2); n=s+0;
              if (n >= 65536) print FILENAME":"NR": large stack buffer ("n" bytes): "$0
            }' src/*.cyr | tee /tmp/bigbuf.txt
          [ -s /tmp/bigbuf.txt ] && FAIL=1
          echo "security scan complete (fail: $FAIL)"
          exit $FAIL
