name: Release

on:
  push:
    # Accept both `v1.2.3` and `1.2.3` tag styles. The version-verify step
    # below enforces semver shape + match against the VERSION file.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  # prakash vendors the full stdlib snapshot under lib/ for hermetic, reproducible
  # builds (it shadows the toolchain's version-matched lib/ — intentional).
  CYRIUS_NO_WARN_SHADOW_LIB: "1"

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${GITHUB_REF_NAME#v}"   # strip optional leading 'v' so v2.0.0 == 2.0.0
          echo "$TAG" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag ($TAG) is not semver x.y.z"; exit 1; }
          [ "$FILE_VERSION" = "$TAG" ] || {
            echo "VERSION ($FILE_VERSION) != tag ($TAG)"; exit 1; }
          echo "Version verified: $TAG (cyrius.cyml pulls from VERSION via \${file:VERSION})"

      - name: Install Cyrius toolchain
        # Piped through the UPSTREAM installer, fetched from the pin's own
        # IMMUTABLE tag, rather than unpacking the release tarball by hand.
        # The hand-rolled block this replaces had three defects; only the first
        # was visible, and it is a hard failure from 6.5.33 onward:
        #
        #   1. LAYOUT. cyrius resolves its stdlib snapshot from
        #      ~/.cyrius/versions/<pin>/lib. The old block laid the tarball out
        #      FLAT as ~/.cyrius/{bin,lib}, so `cyrius deps` fails with
        #      "pins version <pin> but it is not installed at
        #      .../versions/<pin>/lib". Reproduced against 6.5.33.
        #   2. NO INTEGRITY CHECK. It was a bare `curl -sLO` on a release
        #      tarball, untarred. The installer fails closed on a missing,
        #      unverifiable or mismatched .sha256 (CVE-21) and verifies an
        #      Ed25519 signature over SHA256SUMS where one is published
        #      (CVE-13). This repo ships a SECURITY.md and a security job and
        #      was installing an unverified binary toolchain.
        #   3. THE STEP COULD NOT FAIL. Every copy ended in
        #      `2>/dev/null || true`, so an empty bin/ or a missing lib/
        #      "installed successfully" and surfaced later as an unrelated
        #      error. A step that cannot fail is not a step.
        #
        # The pin in cyrius.cyml stays the single source of truth — no version
        # is hardcoded in this YAML.
        run: |
          set -euo pipefail
          CYRIUS_VERSION="$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)"
          [ -n "$CYRIUS_VERSION" ] || { echo "::error::no cyrius pin in cyrius.cyml"; exit 1; }
          echo "Installing Cyrius $CYRIUS_VERSION (pin from cyrius.cyml)"
          curl -sSfL "https://raw.githubusercontent.com/MacCracken/cyrius/$CYRIUS_VERSION/scripts/install.sh" \
            | CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Verify toolchain matches the pin
        # The layout failure above surfaced two steps downstream as a path error
        # from `cyrius deps`. Assert it where it is diagnosable instead.
        run: |
          set -euo pipefail
          PIN="$(grep -oP '(?<=^cyrius = ")[^"]+' cyrius.cyml)"
          GOT="$(cyrius version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          [ "$GOT" = "$PIN" ] || { echo "::error::cyrius is $GOT but cyrius.cyml pins $PIN"; exit 1; }
          [ -d "$HOME/.cyrius/versions/$PIN/lib" ] || {
            echo "::error::no stdlib snapshot at ~/.cyrius/versions/$PIN/lib"; exit 1; }
          echo "toolchain $GOT matches pin; snapshot has $(ls "$HOME/.cyrius/versions/$PIN/lib" | wc -l) files"

      - name: Resolve deps
        run: cyrius deps

      - name: Verify dep hashes
        run: |
          if [ -f cyrius.lock ]; then
            cyrius deps --verify
          fi

      - name: Regenerate dist bundles
        run: |
          cyrius distlib
          cyrius distlib ai
          echo "dist/prakash.cyr:    $(wc -c < dist/prakash.cyr) bytes"
          echo "dist/prakash-ai.cyr: $(wc -c < dist/prakash-ai.cyr) bytes"

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/prakash
          echo "prakash: $(wc -c < build/prakash) bytes"

      - name: Test
        run: |
          for f in tests/*.tcyr; do
            [ -f "$f" ] || continue
            cyrius test "$f"
          done

      - name: Clean toolchain artifacts
        run: rm -f cyrius-*.tar.gz

      - name: Archive
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="prakash-${TAG}/" -o "prakash-${TAG}-src.tar.gz" HEAD
          # Ship both self-contained bundles so consumers can pull one via
          # `[deps.prakash] modules = ["dist/prakash.cyr"]` (math-only) or
          # `["dist/prakash-ai.cyr"]` (with the daimon/hoosh AI client).
          cp dist/prakash.cyr "prakash-${TAG}.cyr"
          cp dist/prakash-ai.cyr "prakash-${TAG}-ai.cyr"
          if [ -f build/prakash ]; then
            cp build/prakash "prakash-${TAG}-x86_64-linux"
          fi
          sha256sum prakash-*.tar.gz prakash-*.cyr prakash-*-linux 2>/dev/null > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            prakash-*.tar.gz
            prakash-*.cyr
            prakash-*-linux
            cyrius.lock
            SHA256SUMS
        if: always()

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
      - name: Changelog
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk "/^## \\[${TAG}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
          # Fallback to legacy "## TAG" header if "## [TAG]" not found
          if [ ! -s /tmp/body.md ]; then
            awk "/^## ${TAG}/{found=1; next} /^## /{if(found) exit} found{print}" CHANGELOG.md > /tmp/body.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: "prakash ${{ github.ref_name }}"
          body_path: /tmp/body.md
          prerelease: ${{ startsWith(github.ref_name, '0.') || startsWith(github.ref_name, 'v0.') }}
          files: |
            prakash-*.tar.gz
            prakash-*.cyr
            prakash-*-linux
            cyrius.lock
            SHA256SUMS
